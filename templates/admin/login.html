{% extends "base.html" %}

{% block title %}
ورود به پنل مدیریت
{% endblock %}

{% block content %}

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ورود به پنل مدیریت</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f3f6fb;
            color: #243247;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgb(20 40 80 / 10%);
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2457a7;
            color: #ffffff;
            border-radius: 14px;
            font-size: 28px;
            font-weight: bold;
        }

        .login-header h1 {
            margin: 0 0 10px;
            font-size: 24px;
        }

        .login-header p {
            margin: 0;
            color: #718096;
            line-height: 1.8;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5deeb;
            border-radius: 8px;
            font: inherit;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2457a7;
            box-shadow: 0 0 0 3px rgb(36 87 167 / 12%);
        }

        .btn-primary {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2457a7;
            color: #ffffff;
            font: inherit;
            cursor: pointer;
        }

        .btn-primary:hover {
            background: #193f7a;
        }

        .error-message {
            margin-top: 16px;
            padding: 10px;
            color: #b42318;
            background: #fff0ef;
            border-radius: 8px;
            line-height: 1.8;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 24px 18px;
            }
        }
    </style>
</head>

<body>
  
<div class="login-page">

    <div class="login-card">

        <div class="login-header">

            <div class="logo">
                H
            </div>

            <h1>
                پنل مدیریت
            </h1>

            <p>
                ورود مدیر سیستم
            </p>

        </div>


        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    ایمیل
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="admin@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    رمز عبور
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="رمز عبور"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn-primary"
            >
                ورود به پنل
            </button>


            <div
                id="loginError"
                class="error-message"
                style="display: none;"
            ></div>

        </form>

    </div>

</div>


<script>

const loginForm = document.getElementById("loginForm");
const loginError = document.getElementById("loginError");


loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    loginError.style.display = "none";
    loginError.textContent = "";


    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;


    try {

        const response = await fetch("/users/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email: email,
                password: password
            })

        });


        const data = await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail || "ورود ناموفق بود."
            );

        }


        if (!data.access_token) {

            throw new Error(
                "Access Token دریافت نشد."
            );

        }


        sessionStorage.setItem(
            "access_token",
            data.access_token
        );


        if (data.refresh_token) {

            sessionStorage.setItem(
                "refresh_token",
                data.refresh_token
            );

        }


        const profileResponse = await fetch(
            "/users/me",
            {
                headers: {
                    "Authorization":
                        "Bearer " + data.access_token
                }
            }
        );


        const profile = await profileResponse.json();


        if (!profileResponse.ok) {

            sessionStorage.removeItem("access_token");
            sessionStorage.removeItem("refresh_token");

            throw new Error(
                profile.detail || "دریافت اطلاعات کاربر ناموفق بود."
            );

        }


        if (
            profile.role !== "admin" &&
            profile.role !== "superadmin"
        ) {

            sessionStorage.removeItem("access_token");
            sessionStorage.removeItem("refresh_token");

            throw new Error(
                "شما اجازه ورود به پنل مدیریت را ندارید."
            );

        }


        window.location.href = "/admin/";

    } catch (error) {

        loginError.textContent = error.message;
        loginError.style.display = "block";

    }

});

</script>

{% endblock %}
